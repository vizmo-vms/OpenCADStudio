name: SecurePlan CI

# Checks for the SecurePlan CAD companion build (`--features secureplan`):
# the upstream default-feature build, the SecurePlan tests and clippy, the
# protocol-vector copy, and per-target debug artifacts for manual checkpoints.
# This workflow never publishes anything.

on:
  push:
    branches: [secureplan]
  pull_request:
    branches: [secureplan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureplan-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  linux:
    name: Linux checks and debug build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - name: Upstream build (default features)
        run: cargo build --locked

      - name: Protocol vectors match the pinned manifest
        run: cargo test --locked --features secureplan --lib secureplan::vectors

      # The whole suite (upstream and SecurePlan tests) with the SecurePlan
      # features.
      - name: All tests (secureplan)
        run: cargo test --locked --features secureplan,secureplan-test

      # Release order (releases/latest never moves backwards) and the release
      # workflow's publication rules.
      - name: Release workflow checks
        run: python3 -m unittest discover -s packaging/secureplan -p 'test_*.py' -v

      - name: No other workflow enables secureplan-test
        run: |
          if grep -rln "secureplan-test" .github/workflows | grep -v "^.github/workflows/secureplan-ci.yml$"; then
            echo "::error::only SecurePlan CI may build with secureplan-test"
            exit 1
          fi

      # The test driver answers stdin commands only in secureplan-test builds.
      # With no display the GUI then fails to start, which ends each run.
      - name: Test build answers stdin commands (positive control)
        run: |
          cargo build --locked --features secureplan,secureplan-test
          printf 'pair secureplan-cad://pair?v=1\n' \
            | env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 target/debug/OpenCADStudio --new-instance > test-build.log 2>&1 || true
          grep -q "secureplan-test: driver ready" test-build.log

      - name: Release build ignores stdin commands
        run: |
          cargo build --locked --release --features secureplan
          printf 'pair secureplan-cad://pair?v=1\n' \
            | env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 target/release/OpenCADStudio --new-instance > release-build.log 2>&1 || true
          if grep -q "secureplan-test" release-build.log; then
            echo "::error::the release binary answered a stdin test command"
            exit 1
          fi

      # DSK-08: release builds read or write no drawing outside a session.
      - name: Release build refuses the headless drawing modes
        run: |
          printf '0\nEOF\n' > in.dxf
          printf 'LINE\n' > in.scr
          for args in "--export in.dxf out.dxf" "--dwg-thumbnail in.dxf out.png 64" "--new-instance --script in.scr"; do
            set +e
            env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 target/release/OpenCADStudio $args > refused.log 2>&1
            code=$?
            set -e
            if [ "$code" != 2 ] || ! grep -q "not available in SecurePlan CAD" refused.log || [ -e out.dxf ] || [ -e out.png ]; then
              echo "::error::the release binary ran $args (exit $code)"
              cat refused.log
              exit 1
            fi
          done

      - name: Clippy (warnings are denied inside src/secureplan)
        run: cargo clippy --locked --features secureplan --all-targets

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-debug-linux-x64
          path: |
            target/debug/OpenCADStudio
            packaging/dev/secureplan-cad.desktop
          if-no-files-found: error
          retention-days: 14

  upstream-tests:
    name: Upstream tests (default features)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      # Proves the fork without the feature still passes upstream's suite.
      - name: Upstream tests
        run: cargo test --locked

  macos:
    name: macOS ${{ matrix.arch }} debug build
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan --target ${{ matrix.target }}

      - name: Assemble the development app bundle
        run: |
          packaging/dev/make-dev-app.sh "target/${{ matrix.target }}/debug" "SecurePlan CAD Dev.app"
          ditto -c -k --keepParent "SecurePlan CAD Dev.app" secureplan-cad-dev.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-debug-macos-${{ matrix.arch }}
          path: secureplan-cad-dev.app.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 debug build and MSI
    # windows-2022 ships WiX Toolset 3 (the WIX environment variable), which
    # packaging/windows/*.wxs targets.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan

      # DSK-08: the executable's properties name SecurePlan CAD and its own
      # version, never upstream's.
      - name: Executable identity
        shell: pwsh
        run: |
          $version = (Select-String -Path src/secureplan/mod.rs -Pattern '^pub const VERSION: &str = "(.*)";$').Matches[0].Groups[1].Value
          $info = (Get-Item target\debug\OpenCADStudio.exe).VersionInfo
          $info | Format-List ProductName, FileDescription, ProductVersion, FileVersion
          if ($info.ProductName -ne 'SecurePlan CAD' -or $info.FileDescription -ne 'SecurePlan CAD' -or $info.ProductVersion -ne $version -or $info.FileVersion -ne $version) {
            Write-Error "the executable does not identify as SecurePlan CAD $version"
            exit 1
          }
          $out = & target\debug\OpenCADStudio.exe -V | Out-String
          if ($out.Trim() -ne "SecurePlan CAD $version") { Write-Error "-V printed: $out"; exit 1 }
          $long = & target\debug\OpenCADStudio.exe --version | Out-String
          if (-not $long.StartsWith("SecurePlan CAD $version")) { Write-Error "--version printed: $long"; exit 1 }

      - name: Build the per-user MSI (structure check)
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Exe target\debug\OpenCADStudio.exe -Version 0.1.0 -Out SecurePlanCAD-debug.msi

      # Per-user, no elevation, SecurePlan CAD's own UpgradeCode, no file
      # associations, and the secureplan-cad: scheme under HKCU (DSK-04/05).
      - name: Check the MSI
        shell: pwsh
        run: packaging/windows/check-msi.ps1 -Msi SecurePlanCAD-debug.msi -Version 0.1.0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-debug-windows-x64
          path: |
            target/debug/OpenCADStudio.exe
            SecurePlanCAD-debug.msi
            packaging/dev/secureplan-cad.reg
          if-no-files-found: error
          retention-days: 14

  # DSK-07: the update helper waits for the application to exit, swaps the new
  # app in from the DMG (ditto to the same volume, rename) and relaunches it
  # through Launch Services; a damaged image leaves the app as it was.
  macos-update-helper:
    name: macOS update helper
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: update-helper

      - name: Update helper tests
        run: cargo test --locked --features secureplan,secureplan-test --test secureplan_update_helper

  # DSK-07: an installed 0.1.0 of this test build, running, starts the update
  # through the production launch path; the helper waits for it to exit,
  # upgrades it to 0.1.1 with msiexec (registering the scheme under HKCU),
  # relaunches the installed copy, and the uninstall removes it again.
  windows-update-helper:
    name: Windows update helper
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: update-helper

      # Two per-user MSIs of this test build: 0.1.0, and 0.1.1 whose
      # executable differs by one appended byte, so the upgrade is visible.
      - name: Test build and its per-user MSIs
        shell: pwsh
        run: |
          cargo build --locked --features secureplan,secureplan-test
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Copy-Item target\debug\OpenCADStudio.exe update-new.exe
          $stream = [IO.File]::Open((Resolve-Path update-new.exe).Path, [IO.FileMode]::Append, [IO.FileAccess]::Write)
          $stream.WriteByte(0x53)
          $stream.Close()
          packaging/windows/build-msi.ps1 -Exe target\debug\OpenCADStudio.exe -Version 0.1.0 -Out update-old.msi
          packaging/windows/build-msi.ps1 -Exe update-new.exe -Version 0.1.1 -Out update-new.msi

      - name: Update helper tests
        env:
          SECUREPLAN_TEST_MSI_OLD: ${{ github.workspace }}\update-old.msi
          SECUREPLAN_TEST_MSI_NEW: ${{ github.workspace }}\update-new.msi
          SECUREPLAN_TEST_EXE_NEW: ${{ github.workspace }}\update-new.exe
        run: cargo test --locked --features secureplan,secureplan-test --test secureplan_update_helper -- --nocapture
