name: SecurePlan CI

# Checks for the SecurePlan CAD companion build (`--features secureplan`):
# the upstream default-feature build, the SecurePlan tests and clippy, the
# protocol-vector copy, and per-target debug artifacts for manual checkpoints.
# This workflow never publishes anything.

on:
  push:
    branches: [secureplan]
  pull_request:
    branches: [secureplan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureplan-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux checks and debug build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - name: Upstream build (default features)
        run: cargo build --locked

      - name: Protocol vectors match the pinned manifest
        run: cargo test --locked --features secureplan --lib secureplan::vectors

      # The whole suite (upstream and SecurePlan tests) with the SecurePlan
      # features. The two skipped tests fail identically on the pinned upstream
      # base 0d023d267bc5b7afeca3b54e98875b0efd4f3926 without any SecurePlan
      # change (parametric-constraint solver); remove the skips when a pin
      # bump fixes them.
      - name: All tests (secureplan)
        run: >
          cargo test --locked --features secureplan,secureplan-test --
          --skip arc_grips_drive_center_start_and_end_but_not_midpoint
          --skip symmetric_constraint_mirrors_one_circles_center_across_the_axis_line

      - name: No other workflow enables secureplan-test
        run: |
          if grep -rln "secureplan-test" .github/workflows | grep -v "^.github/workflows/secureplan-ci.yml$"; then
            echo "::error::only SecurePlan CI may build with secureplan-test"
            exit 1
          fi

      # The test driver answers stdin commands only in secureplan-test builds.
      # With no display the GUI then fails to start, which ends each run.
      - name: Test build answers stdin commands (positive control)
        run: |
          cargo build --locked --features secureplan,secureplan-test
          printf 'pair secureplan-cad://pair?v=1\n' \
            | env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 target/debug/OpenCADStudio --new-instance > test-build.log 2>&1 || true
          grep -q "secureplan-test: driver ready" test-build.log

      - name: Release build ignores stdin commands
        run: |
          cargo build --locked --release --features secureplan
          printf 'pair secureplan-cad://pair?v=1\n' \
            | env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 target/release/OpenCADStudio --new-instance > release-build.log 2>&1 || true
          if grep -q "secureplan-test" release-build.log; then
            echo "::error::the release binary answered a stdin test command"
            exit 1
          fi

      - name: Clippy (warnings are denied inside src/secureplan)
        run: cargo clippy --locked --features secureplan --all-targets

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan

      - uses: actions/upload-artifact@v4
        with:
          name: secureplan-cad-debug-linux-x64
          path: |
            target/debug/OpenCADStudio
            packaging/dev/secureplan-cad.desktop
          if-no-files-found: error
          retention-days: 14

  upstream-tests:
    name: Upstream tests (default features)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      # Proves the fork without the feature still passes upstream's suite. The
      # skipped tests fail the same way on the pinned base (see above).
      - name: Upstream tests
        run: >
          cargo test --locked --
          --skip arc_grips_drive_center_start_and_end_but_not_midpoint
          --skip symmetric_constraint_mirrors_one_circles_center_across_the_axis_line

  macos:
    name: macOS ${{ matrix.arch }} debug build
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan --target ${{ matrix.target }}

      - name: Assemble the development app bundle
        run: |
          packaging/dev/make-dev-app.sh "target/${{ matrix.target }}/debug" "SecurePlan CAD Dev.app"
          ditto -c -k --keepParent "SecurePlan CAD Dev.app" secureplan-cad-dev.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: secureplan-cad-debug-macos-${{ matrix.arch }}
          path: secureplan-cad-dev.app.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 debug build and MSI
    # windows-2022 ships WiX Toolset 3 (the WIX environment variable), which
    # packaging/windows/*.wxs targets.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Debug build (secureplan)
        run: cargo build --locked --features secureplan

      - name: Build the per-user MSI (structure check)
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Exe target\debug\OpenCADStudio.exe -Version 0.1.0 -Out SecurePlanCAD-debug.msi

      # Per-user, no elevation, SecurePlan CAD's own UpgradeCode, no file
      # associations, and the secureplan-cad: scheme under HKCU (DSK-04/05).
      - name: Check the MSI
        shell: pwsh
        run: packaging/windows/check-msi.ps1 -Msi SecurePlanCAD-debug.msi -Version 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: secureplan-cad-debug-windows-x64
          path: |
            target/debug/OpenCADStudio.exe
            SecurePlanCAD-debug.msi
            packaging/dev/secureplan-cad.reg
          if-no-files-found: error
          retention-days: 14

  # DSK-07: the update helper waits for the application to exit, swaps the new
  # app in from the DMG (ditto to the same volume, rename) and relaunches it
  # through Launch Services; a damaged image leaves the app as it was.
  macos-update-helper:
    name: macOS update helper
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: update-helper

      - name: Update helper tests
        run: cargo test --locked --features secureplan,secureplan-test --test secureplan_update_helper

  # DSK-07: the update helper waits for the application to exit, installs a
  # per-user MSI of this test build with msiexec (registering the scheme under
  # HKCU), relaunches the installed copy, and the uninstall removes it again.
  windows-update-helper:
    name: Windows update helper
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: update-helper

      - name: Test build and its per-user MSI
        shell: pwsh
        run: |
          cargo build --locked --features secureplan,secureplan-test
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          packaging/windows/build-msi.ps1 -Exe target\debug\OpenCADStudio.exe -Version 0.1.0 -Out update-test.msi

      - name: Update helper tests
        env:
          SECUREPLAN_TEST_MSI: ${{ github.workspace }}\update-test.msi
        run: cargo test --locked --features secureplan,secureplan-test --test secureplan_update_helper
