name: SecurePlan CAD release

# Builds and publishes SecurePlan CAD releases (DSK-05, DSK-07):
#   SecurePlanCAD-macos-arm64.dmg, SecurePlanCAD-macos-x64.dmg (ad-hoc signed),
#   SecurePlanCAD-windows-x64.msi (per-user, no signing), the source archive
#   SecurePlanCAD-source.tar.gz and SHA256SUMS over all four.
#
# - Pushing the tag `secureplan-cad-vX.Y.Z` (on the secureplan branch, equal to
#   VERSION in src/secureplan/mod.rs, with release notes in
#   packaging/secureplan/release-notes/X.Y.Z.md) builds everything and then
#   publishes: draft release -> upload every asset -> download and verify
#   them against SHA256SUMS -> publish and mark latest -> check that
#   releases/latest/download/<name> serves them.
# - A pull request into secureplan that touches the release workflow,
#   packaging or the updater, and a manual run (workflow_dispatch, which needs
#   the workflow on the default branch), are always a DRY RUN: they build every
#   asset, write and verify SHA256SUMS, and upload them as workflow artifacts
#   only. They never create, edit or publish a release: the publish job runs
#   only for a tag push, and it is the only job whose token may write.
# - Publication is serialized across all tags (one concurrency group), and a
#   version that is not newer than the latest published release is refused
#   (packaging/secureplan/release_order.py), so releases/latest never moves
#   backwards.
#
# Actions are pinned to commits and Rust to an exact toolchain.
#
# Never enables the test-only cargo feature (SecurePlan CI fails any other
# workflow that names it).

on:
  push:
    tags: ["secureplan-cad-v*"]
  pull_request:
    branches: [secureplan]
    paths:
      - .github/workflows/secureplan-release.yml
      - packaging/**
      - src/secureplan/update.rs
      - src/secureplan/update_helper.rs
      - src/secureplan/ui/update_dialog.rs
      - src/io/update_check.rs
      - tests/secureplan_update_helper.rs
  workflow_dispatch:

permissions:
  contents: read

# Builds of one ref run one at a time (a newer pull request push replaces an
# older dry run); publication has its own global group (the publish job).
concurrency:
  group: secureplan-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  prepare:
    name: Version, tag and notes
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      protocol: ${{ steps.version.outputs.protocol }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Release order and publication rules
        run: python3 -m unittest discover -s packaging/secureplan -p 'test_*.py' -v

      - name: Check the version, tag and release notes
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' src/secureplan/mod.rs)"
          protocol="$(sed -n 's/^pub const PROTOCOL: u32 = \([0-9][0-9]*\);$/\1/p' src/secureplan/mod.rs)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || (( BASH_REMATCH[1] > 255 )); then
            echo "::error::VERSION '$version' must be MAJOR.MINOR.PATCH with MAJOR <= 255"
            exit 1
          fi
          test -n "$protocol"
          tag="secureplan-cad-v$version"
          notes="packaging/secureplan/release-notes/$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing: every release needs its notes"
            exit 1
          fi
          publish=false
          if [ "$EVENT" = push ]; then
            if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
              echo "::error::the tag $REF_NAME does not match VERSION $version (expected $tag)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/secureplan; then
              echo "::error::$tag is not on the secureplan branch"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "protocol=$protocol"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## SecurePlan CAD $version"
            echo "Tag \`$tag\`, bridge protocol $protocol, commit \`$GITHUB_SHA\`."
            if [ "$publish" = true ]; then echo "This run publishes the release."; else echo "**Dry run:** nothing is published."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS ${{ matrix.arch }} disk image
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            lipo: arm64
          - arch: x64
            target: x86_64-apple-darwin
            lipo: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Release build (secureplan)
        run: cargo build --locked --release --features secureplan --target ${{ matrix.target }} --bin OpenCADStudio --bin ocs_launcher

      - name: The build embeds its fork commit
        run: grep -aqF "$GITHUB_SHA" "target/${{ matrix.target }}/release/OpenCADStudio"

      - name: Install librsvg (icon)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install librsvg

      - name: Assemble, sign and package
        run: packaging/secureplan/make-release-dmg.sh "target/${{ matrix.target }}/release" "${{ matrix.lipo }}" "SecurePlanCAD-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-macos-${{ matrix.arch }}
          path: SecurePlanCAD-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 installer
    needs: prepare
    # windows-2022 ships WiX Toolset 3 (the WIX environment variable).
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Release build (secureplan)
        run: cargo build --locked --release --features secureplan --bin OpenCADStudio

      - name: The build embeds its fork commit
        shell: bash
        run: grep -aqF "$GITHUB_SHA" target/release/OpenCADStudio.exe

      - name: Build the per-user MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Exe target\release\OpenCADStudio.exe -Version "${{ needs.prepare.outputs.version }}" -Out SecurePlanCAD-windows-x64.msi

      - name: Check the MSI
        shell: pwsh
        run: packaging/windows/check-msi.ps1 -Msi SecurePlanCAD-windows-x64.msi -Version "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-windows-x64
          path: SecurePlanCAD-windows-x64.msi
          if-no-files-found: error
          retention-days: 14

  source:
    name: Source archive
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The corresponding source with the build scripts, workflows and
      # Cargo.lock (GPL-3.0; DSK-05).
      - name: Archive the source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: git archive --format=tar.gz --prefix="OpenCADStudio-$TAG/" -o SecurePlanCAD-source.tar.gz "$GITHUB_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-source
          path: SecurePlanCAD-source.tar.gz
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: [prepare, macos, windows, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: secureplan-cad-*
          path: dist
          merge-multiple: true

      - name: Write and verify SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          assets=(SecurePlanCAD-macos-arm64.dmg SecurePlanCAD-macos-x64.dmg SecurePlanCAD-windows-x64.msi SecurePlanCAD-source.tar.gz)
          if [ "$(ls | sort)" != "$(printf '%s\n' "${assets[@]}" | sort)" ]; then
            echo "::error::unexpected assets: $(ls | tr '\n' ' ')"
            exit 1
          fi
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo '### SHA256SUMS'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secureplan-cad-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the release (tag pushes only)
    needs: [prepare, checksums]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # One publication at a time across every tag, never cancelled: a slower
    # older release cannot overtake a newer one (and is refused below).
    concurrency:
      group: secureplan-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROTOCOL: ${{ needs.prepare.outputs.protocol }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secureplan-cad-release
          path: dist

      - name: Write the release notes
        run: |
          {
            cat "packaging/secureplan/release-notes/$VERSION.md"
            echo
            echo "## Build"
            echo
            echo "- SecurePlan CAD $VERSION, bridge protocol $PROTOCOL, fork commit \`$GITHUB_SHA\`."
            echo "- Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > release-notes.md

      # Verify, check the order against releases/latest (404 means none; any
      # other lookup failure stops), draft, upload, verify the draft, check
      # the order again, publish and mark latest, check releases/latest.
      # Tested with a stub gh: packaging/secureplan/test_publish_release.py.
      - name: Publish
        run: packaging/secureplan/publish-release.sh "$TAG" "$VERSION" dist release-notes.md
